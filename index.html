<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>🌸 养花小助手 · 语音提问版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Comic Sans MS", "幼圆", "YouYuan", "Segoe UI Emoji", sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .chat-box {
      width: 100%;
      max-width: 750px;
      height: 90vh;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(233,30,99,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px solid #f8bbd0;
    }
    .header {
      background: linear-gradient(120deg, #ff9a9e 0%, #fad0c4 100%);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .header .avatar { font-size: 38px; background: white; border-radius: 30px; padding: 6px; }
    .header h1 { font-size: 24px; font-weight: 600; }
    .header .badge { margin-left: auto; background: rgba(255,255,255,0.4); padding: 6px 16px; border-radius: 30px; font-size: 14px; font-weight: bold; }
    .messages {
      flex: 1; overflow-y: auto; padding: 20px 18px;
      display: flex; flex-direction: column; gap: 16px; background: #fff9fb;
    }
    .message { display: flex; gap: 8px; animation: popIn 0.25s ease-out; }
    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }
    .bubble {
      max-width: 78%; padding: 14px 18px; border-radius: 26px;
      line-height: 1.5; word-break: break-word; white-space: pre-wrap; font-size: 15px;
    }
    .user .bubble { background: #ffd54f; color: #5d4037; border-bottom-right-radius: 8px; }
    .assistant .bubble { background: white; border: 2px solid #f8bbd0; border-bottom-left-radius: 8px; color: #4a3b4c; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 20px 4px; }
    .quick-btn {
      background: #fce4ec; border: none; border-radius: 20px; padding: 8px 16px;
      font-size: 13px; color: #ad1457; cursor: pointer; transition: 0.2s;
      font-family: inherit; border: 1px solid #f8bbd0;
    }
    .quick-btn:hover { background: #f8bbd0; transform: translateY(-1px); }
    .input-area { padding: 14px 20px 20px; background: white; border-top: 1px solid #f8bbd0; }
    .input-row { display: flex; gap: 10px; align-items: center; }
    #userInput {
      flex: 1; border: 2px solid #f8bbd0; border-radius: 30px;
      padding: 12px 20px; font-size: 15px; outline: none;
      resize: none; font-family: inherit; background: #fff9fb;
    }
    #userInput:focus { border-color: #ff9a9e; }
    /* 语音按钮样式 */
    .voice-btn {
      background: #ff9a9e; border: none; color: white;
      font-size: 22px; width: 46px; height: 46px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: 0.2s; flex-shrink: 0;
    }
    .voice-btn:hover { background: #f06292; }
    .voice-btn.recording { background: #e53935; animation: pulse 1s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(233,30,99,0.6); }
      70% { box-shadow: 0 0 0 12px rgba(233,30,99,0); }
      100% { box-shadow: 0 0 0 0 rgba(233,30,99,0); }
    }
    #sendBtn {
      background: #ff9a9e; border: none; color: white; font-weight: bold;
      padding: 12px 24px; border-radius: 30px; cursor: pointer; font-size: 15px; transition: 0.2s;
    }
    #sendBtn:hover { background: #f06292; }
    #sendBtn:disabled { background: #ddd; cursor: not-allowed; }
    .typing span {
      display: inline-block; width: 8px; height: 8px; background: #bbb;
      border-radius: 50%; margin: 0 3px; animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(1) { animation-delay: 0s; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="chat-box">
  <div class="header">
    <span class="avatar">🌻</span>
    <h1>养花小助手</h1>
    <span class="badge">🌿 无需登录</span>
  </div>

  <div class="quick-btns">
    <button class="quick-btn" onclick="quickAsk('我的花叶子发黄了，怎么办？')">🍂 叶子发黄</button>
    <button class="quick-btn" onclick="quickAsk('怎么给花浇水才不会太多？')">💧 浇水技巧</button>
    <button class="quick-btn" onclick="quickAsk('有没有适合小朋友种的容易活的花？')">🌼 新手植物</button>
    <button class="quick-btn" onclick="quickAsk('花盆里长小虫子了，怎么处理？')">🐛 小虫子</button>
  </div>

  <div class="messages" id="messages">
    <div class="message assistant">
      <div class="bubble">
        🌸 你好呀，我是养花小助手！<br>
        你可以打字提问，也可以点下面的🎤按钮，直接说话问我哦～<br>
        让我们一起照顾小花吧！
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <!-- 🎤 语音按钮（新增） -->
      <button id="voiceBtn" class="voice-btn" title="点击说话">🎤</button>
      <textarea id="userInput" rows="1" placeholder="打字或按🎤说话…"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
      <button id="sendBtn" onclick="send()">发送 🌱</button>
    </div>
  </div>
</div>

<script>
  // ===== 配置 =====
  const WORKER_URL = 'https://misty-forest-a356.775459571.workers.dev'; // 改成你的 Cloudflare Worker 地址

  const SYSTEM_PROMPT = `
你叫“养花小助手”，是一位经验丰富、充满爱心和童趣的养花人。
你的任务是用生动、有趣、简单易懂的方式，帮助小学生解决养花中遇到的问题。

- 用孩子能听懂的语言，避免专业术语，多用比喻和故事。
- 语气活泼、温暖，多使用表情符号和拟人化的表达。
- 如果问题不清楚，可以温柔地引导小朋友补充细节。
- 除了解答问题，还可以主动分享有趣的植物小知识。
- 鼓励小朋友自己动手尝试，感受养花的快乐。

记住，你是在和一群可爱的小学生聊天，要让他们觉得你就是花园里最会讲故事的大姐姐/大哥哥。
  `;

  // ===== 对话功能 =====
  const messagesDiv = document.getElementById('messages');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  let waiting = false;

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(bubble);
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message assistant';
    div.id = 'typing';
    div.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if(t) t.remove();
  }

  async function send() {
    const text = input.value.trim();
    if(!text || waiting) return;

    addMessage('user', text);
    input.value = '';
    waiting = true;
    sendBtn.disabled = true;

    showTyping();

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            { role: 'user', content: text }
          ],
          temperature: 0.8,
          max_tokens: 800
        })
      });

      hideTyping();

      if(!res.ok) {
        const err = await res.json().catch(()=>({}));
        throw new Error(err.error?.message || '网络开小差了');
      }

      const data = await res.json();
      const reply = data.choices[0].message.content;
      addMessage('assistant', reply);
    } catch(e) {
      hideTyping();
      addMessage('assistant', '😢 哎呀，小助手的花园网络不太好，请再试一次吧～');
    } finally {
      waiting = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function quickAsk(q) {
    input.value = q;
    send();
  }

  // ===== 语音识别功能 =====
  const voiceBtn = document.getElementById('voiceBtn');
  let recognition = null;
  let isRecording = false;

  // 检查浏览器是否支持语音识别
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';          // 识别中文
    recognition.interimResults = true;   // 显示临时结果（边说边出字）
    recognition.continuous = false;      // 说完一句话自动停止

    recognition.onresult = (event) => {
      let finalTranscript = '';
      let interimTranscript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalTranscript += transcript;
        } else {
          interimTranscript += transcript;
        }
      }
      // 把识别到的文字填入输入框
      input.value = finalTranscript || interimTranscript;
    };

    recognition.onerror = (event) => {
      console.error('语音识别错误', event.error);
      stopRecording();
      if (event.error === 'not-allowed') {
        alert('麦克风权限被拒绝，请在浏览器设置中允许麦克风访问。');
      } else {
        alert('语音识别出错了，请再试一次吧～');
      }
    };

    recognition.onend = () => {
      stopRecording();
    };
  } else {
    // 如果不支持，隐藏语音按钮
    voiceBtn.style.display = 'none';
    input.placeholder = '输入你的养花问题…';
  }

  function startRecording() {
    if (!recognition) {
      alert('你的浏览器不支持语音输入，请使用 Chrome 浏览器打开哦。');
      return;
    }
    try {
      recognition.start();
      isRecording = true;
      voiceBtn.classList.add('recording');
      voiceBtn.innerHTML = '🔴';  // 变成红色圆点表示正在录制
    } catch (e) {
      console.error(e);
    }
  }

  function stopRecording() {
    if (recognition) {
      recognition.stop();
    }
    isRecording = false;
    voiceBtn.classList.remove('recording');
    voiceBtn.innerHTML = '🎤';
  }

  voiceBtn.addEventListener('click', () => {
    if (isRecording) {
      stopRecording();  // 如果正在录音，再次点击就停止
    } else {
      startRecording();
    }
  });

  // 说话结束后自动发送（可选：如果想直接发送，取消下面注释）
  // recognition.onend = () => {
  //   stopRecording();
  //   if (input.value.trim()) send();
  // };
</script>
</body>
</html>
